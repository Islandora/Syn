name: CI

on:
  push:
    branches: [ 1.x ]
  pull_request:
    branches: [ 1.x ]

jobs:
  release-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release version
        run: |
          git fetch --tags --force origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          bash scripts/validate-release-version.sh
        env:
          BASE_REF: ${{ github.base_ref }}
          REQUIRE_VERSION_BUMP: 'true'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: build_dir
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          check-latest: true
          cache: 'gradle'
      - name: Gradle Check
        run: |
          cd $GITHUB_WORKSPACE/build_dir
          ./gradlew check -PtomcatVersion="9.0.118"
      - name: Jacoco Test
        run: |
          cd $GITHUB_WORKSPACE/build_dir
          ./gradlew jacocoTestReport -PtomcatVersion="9.0.118"
      - name: Codecov
        uses: codecov/codecov-action@v7
