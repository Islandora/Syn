name: CI

on:
  push:
    branches: [ 2.x ]
  pull_request:
    branches: [ 2.x ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: build_dir
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: 'gradle'
      - name: Gradle Check
        run: |
          cd $GITHUB_WORKSPACE/build_dir
          ./gradlew check
      - name: Jacoco Test
        run: |
          cd $GITHUB_WORKSPACE/build_dir
          ./gradlew jacocoTestReport
      - name: Codecov
        uses: codecov/codecov-action@v7
